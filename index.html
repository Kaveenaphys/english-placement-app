<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>english-placement-app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <form
  name="assessment-results"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  hidden
>
  <input type="hidden" name="form-name" value="assessment-results" />

  <input name="candidateName" />
  <input name="candidateEmail" />
  <input name="candidatePhone" />
  <input name="candidateCountryCode" />

  <input name="previousEnglishTest" />
  <input name="interestedCourse" />
  <input name="targetTest" />

  <input name="grammarScore" />
  <input name="readingScore" />
  <input name="listeningScore" />

  <input name="totalScore" />
  <input name="percentage" />
  <input name="recommendedLevel" />
  <input name="submittedAt" />

  <input name="bot-field" />
</form>
  </body>
</html>
